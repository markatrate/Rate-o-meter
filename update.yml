name: Update Rate-o-meter data

on:
  schedule:
    # Every 2 hours, 8 AM - 6 PM ET, Monday-Friday (cron is UTC)
    - cron: "0 12,14,16,18,20,22 * * 1-5"
  workflow_dispatch: {}   # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps
      - name: Run updater
        run: python update_data.py
      - name: Commit if changed
        run: |
          git config user.name "rateometer-bot"
          git config user.email "bot@users.noreply.github.com"
          git add rateometer-data.json
          git diff --cached --quiet || git commit -m "Auto-update rate data"
          git push
